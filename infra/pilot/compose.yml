# Form Builder on one server, for a pilot: everything in Docker behind Caddy, which gets the HTTPS certificates.
# Files and email go through AWS (S3, SES) and connector credentials are wrapped by a KMS key; the server's
# own role gives access, so there are no AWS keys here. Values come from the .env file beside this one,
# which deploy.sh writes from the parameter store.
name: fb

x-api-env: &api-env
  NODE_ENV: production
  # The server has 2 GB for everything: each Node process keeps to a share of it.
  NODE_OPTIONS: --max-old-space-size=384
  PORT: "4100"
  MONGODB_URL: mongodb://mongo:27017/form-builder
  JWT_SECRET: ${JWT_SECRET}
  SECRET_KEY: ${SECRET_KEY}
  APP_URL: https://${APP_HOST}
  API_URL: https://${API_HOST}
  FORM_APP_URL: https://${FORMS_HOST}
  CORS_ORIGINS: https://${APP_HOST},https://${FORMS_HOST}
  COOKIE_SECURE: "true"
  MAIL_PROVIDER: ses
  MAIL_FROM: ${MAIL_FROM}
  AWS_REGION: ${AWS_REGION}
  STORAGE_PROVIDER: s3
  UPLOADS_BUCKET: ${UPLOADS_BUCKET}
  KMS_KEY_ID: ${KMS_KEY_ID}
  DEFAULT_PLAN: ${DEFAULT_PLAN}
  # Who may start an organisation: closed means only the operators, who add each customer.
  SIGNUP: ${SIGNUP:-closed}
  OPERATOR_EMAILS: ${OPERATOR_EMAILS:-}
  # Customers deploying their own code by themselves: their image spaces, and the role that hands out push passwords.
  EXT_REGISTRY: ${EXT_REGISTRY:-}
  EXT_PUSH_ROLE_ARN: ${EXT_PUSH_ROLE_ARN:-}
  # The build project that builds customers' extensions from their own repositories.
  EXT_BUILD_PROJECT: ${EXT_BUILD_PROJECT:-}
  FILE_SCANNER: none
  JOBS_POLL: "true"

services:
  mongo:
    image: mongo:7
    # A quarter of a gigabyte of cache: plenty for a pilot, and it leaves room for the rest.
    command: ["--bind_ip_all", "--quiet", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: [mongo:/data/db]
    # Only the API and the worker can reach the database: it is on no other network and has no published port.
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    image: ${REGISTRY}/fb-api:${TAG}
    environment:
      <<: *api-env
      JOBS_ROLE: enqueue
    networks: [data, edge]
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 40

  worker:
    image: ${REGISTRY}/fb-api:${TAG}
    command: ["node", "dist/worker.js"]
    environment:
      <<: *api-env
      JOBS_ROLE: run
    networks: [data, edge]
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }

  studio:
    image: ${REGISTRY}/fb-studio:${TAG}
    networks: [edge]
    restart: unless-stopped

  runtime:
    image: ${REGISTRY}/fb-runtime:${TAG}
    networks: [edge]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      APP_HOST: ${APP_HOST}
      FORMS_HOST: ${FORMS_HOST}
      API_HOST: ${API_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates: kept, so a restart does not ask for new ones.
      - caddy:/data
    networks: [edge]
    restart: unless-stopped
    depends_on: [api, studio, runtime]

networks:
  data:
    internal: true
  edge: {}

volumes:
  mongo: {}
  caddy: {}
