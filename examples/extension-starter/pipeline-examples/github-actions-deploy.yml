# Only for teams that build the image themselves. If you linked this repository in Form Builder (Extensions >
# Deploy from your repository), you do not need this file. To use it, copy it to .github/workflows/deploy.yml.
#
# Builds this repository as a version of your extension and deploys it to Form Builder, on every commit to main.
# It needs two things from your repository's settings (Settings > Secrets and variables > Actions):
#   secret   FB_DEPLOY_KEY   the deploy key from Form Builder's Extensions page ("Make a deploy key")
#   variable FB_API_URL      the address shown beside it on that page
name: Deploy to Form Builder
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer commit waits for the one under way.
concurrency:
  group: form-builder-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FB_API_URL: ${{ vars.FB_API_URL }}
      FB_DEPLOY_KEY: ${{ secrets.FB_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the settings
        run: |
          if [ -z "$FB_API_URL" ] || [ -z "$FB_DEPLOY_KEY" ]; then
            echo "::error::Set the secret FB_DEPLOY_KEY and the variable FB_API_URL in this repository's settings. Both are on Form Builder's Extensions page."
            exit 1
          fi

      - name: Sign in to your image space
        id: space
        run: |
          login=$(curl -sS --fail-with-body -X POST "$FB_API_URL/extensions/pipeline/login" -H "Authorization: Bearer $FB_DEPLOY_KEY")
          password=$(jq -r .password <<<"$login")
          echo "::add-mask::$password"
          docker login "$(jq -r .registry <<<"$login")" -u AWS --password-stdin <<<"$password"
          echo "image=$(jq -r .image <<<"$login")" >> "$GITHUB_OUTPUT"
          echo "platform=$(jq -r .platform <<<"$login")" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # The server may be a different kind of machine from this runner: build for the kind it is.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        run: docker buildx build --platform "${{ steps.space.outputs.platform }}" --provenance=false -t "${{ steps.space.outputs.image }}:${{ steps.space.outputs.version }}" --push .

      - name: Deploy and wait for the result
        env:
          VERSION: ${{ steps.space.outputs.version }}
        run: |
          curl -sS --fail-with-body -X POST "$FB_API_URL/extensions/pipeline/deploy" -H "Authorization: Bearer $FB_DEPLOY_KEY" -H "Content-Type: application/json" -d "{\"tag\":\"$VERSION\"}" >/dev/null
          for i in $(seq 1 72); do
            sleep 5
            latest=$(curl -sS --fail-with-body "$FB_API_URL/extensions/pipeline/latest" -H "Authorization: Bearer $FB_DEPLOY_KEY") || continue
            case "$(jq -r .status <<<"$latest")" in
              LIVE)
                echo "$(jq -r .message <<<"$latest")"
                exit 0 ;;
              FAILED)
                echo "::error::$(jq -r .message <<<"$latest")"
                echo "What your code printed:"
                jq -r .output <<<"$latest"
                exit 1 ;;
            esac
          done
          echo "::error::The deployment did not finish in six minutes. Look at Form Builder's Extensions page."
          exit 1
