name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Real databases for the connectors' own tests: each writes a table's rules back in its own words.
    # The password is for these throwaway containers only; it protects nothing.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Test-Only-Passw0rd
        ports: ['1433:1433']
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: Test-Only-Passw0rd
        ports: ['5432:5432']
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: Test-Only-Passw0rd
          MYSQL_DATABASE: fb
        ports: ['3306:3306']
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: Test-Only-Passw0rd
          APP_USER: fb
          APP_USER_PASSWORD: Test-Only-Passw0rd
        ports: ['1521:1521']
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      MSSQL_TEST: 127.0.0.1:1433:Test-Only-Passw0rd
      ORACLE_TEST: 127.0.0.1:1521:Test-Only-Passw0rd
      PG_TEST: 127.0.0.1:5432:Test-Only-Passw0rd
      MYSQL_TEST: 127.0.0.1:3306:Test-Only-Passw0rd
      # The API's one-second promise is measured on the product's own size of machine; this runner is smaller and shared.
      API_P95_BUDGET_MS: 2000
      # Two outside checkers of the PDFs we make, which share no code with what makes them. Here they must run;
      # on a developer's machine the tests that use them are skipped when they are not installed.
      REQUIRE_PDFSIG: '1'
      REQUIRE_VERAPDF: '1'
      # A real identity provider (Keycloak, started in a step below) for "sign in as a person" on a connector.
      KEYCLOAK_TEST: http://127.0.0.1:8088
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The API's e2e tests run on an in-memory MongoDB, which downloads its binary once.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Started first, so it is up by the time the tests want it. (It needs a command of its own, which a service cannot be given.)
      - run: docker run -d --name keycloak -p 8088:8080 -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin quay.io/keycloak/keycloak:26.0 start-dev
      - run: pnpm install --frozen-lockfile
      # pdfsig (poppler) checks the seal on a sealed PDF; veraPDF checks that an archival PDF really is PDF/A.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils && pdfsig -v && docker pull -q verapdf/cli
      # The API and gateway load these two packages from their build output.
      - run: pnpm --filter @fb/engine --filter @fb/connectors --filter @fb/sdk --filter @fb/gateway build
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/realms/master)" = "200" ]; then echo "Keycloak is ready"; exit 0; fi
            sleep 3
          done
          docker logs keycloak 2>&1 | tail -30
          exit 1
      - run: pnpm test
      - run: pnpm test:infra
      - run: pnpm build

  browser:
    # The whole product in a real browser: API, builder, public form app and the gateway agent.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      E2E_MONGODB_URL: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fb/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: e2e/test-results
          retention-days: 7

  docker:
    # Both ways of hosting a customer, in Docker: shared and dedicated, with customers'
    # extensions delivered by the pipeline (docs/hosting.md).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fb/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e:docker
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-results
          path: e2e/test-results
          retention-days: 7

  # Db2 and IBM's driver for it exist only for some kinds of machine (this runner is one), and Db2 takes minutes
  # to start, so the Db2 connector has a job of its own: the real database, IBM's real driver, the connector's own test.
  db2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      db2:
        image: icr.io/db2_community/db2:11.5.9.0
        env:
          LICENSE: accept
          DB2INSTANCE: db2inst1
          DB2INST1_PASSWORD: Test-Only-Passw0rd
          DBNAME: testdb
          ARCHIVE_LOGS: 'false'
          AUTOCONFIG: 'false'
        ports: ['50000:50000']
        options: --privileged
    env:
      DB2_TEST: 127.0.0.1:50000:Test-Only-Passw0rd
      DB2_DRIVER_PATH: /tmp/db2driver/node_modules/ibm_db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fb/engine --filter @fb/connectors build
      # IBM's driver, in a folder of its own: it is not part of the product, and is fetched from IBM as it installs.
      - run: mkdir -p /tmp/db2driver && cd /tmp/db2driver && npm init -y >/dev/null && npm install ibm_db@3
      - name: Wait for Db2 to finish setting itself up
        run: |
          id=$(docker ps -q --filter "ancestor=icr.io/db2_community/db2:11.5.9.0")
          for i in $(seq 1 150); do
            if docker logs "$id" 2>&1 | grep -q "Setup has completed"; then echo "Db2 is ready"; exit 0; fi
            sleep 10
          done
          docker logs "$id" 2>&1 | tail -40
          exit 1
      - run: pnpm --filter @fb/connectors test -- db2-live

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
