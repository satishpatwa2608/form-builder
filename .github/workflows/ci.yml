name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Real databases for the connectors' own tests: each writes a table's rules back in its own words.
    # The password is for these throwaway containers only; it protects nothing.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Test-Only-Passw0rd
        ports: ['1433:1433']
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: Test-Only-Passw0rd
        ports: ['5432:5432']
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: Test-Only-Passw0rd
          MYSQL_DATABASE: fb
        ports: ['3306:3306']
    env:
      MSSQL_TEST: 127.0.0.1:1433:Test-Only-Passw0rd
      PG_TEST: 127.0.0.1:5432:Test-Only-Passw0rd
      MYSQL_TEST: 127.0.0.1:3306:Test-Only-Passw0rd
      # The API's one-second promise is measured on the product's own size of machine; this runner is smaller and shared.
      API_P95_BUDGET_MS: 2000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The API's e2e tests run on an in-memory MongoDB, which downloads its binary once.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      # The API and gateway load these two packages from their build output.
      - run: pnpm --filter @fb/engine --filter @fb/connectors --filter @fb/sdk --filter @fb/gateway build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:infra
      - run: pnpm build

  browser:
    # The whole product in a real browser: API, builder, public form app and the gateway agent.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      E2E_MONGODB_URL: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fb/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: e2e/test-results
          retention-days: 7

  docker:
    # Both ways of hosting a customer, in Docker: shared and dedicated, with customers'
    # extensions delivered by the pipeline (docs/hosting.md).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fb/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e:docker
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-results
          path: e2e/test-results
          retention-days: 7

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
